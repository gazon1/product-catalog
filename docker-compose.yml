# Production / VPS compose.
#
# The site talks to the crawler's PostgreSQL over the network and never manages
# it: no `db` service here, no volume, no migration step. `docker compose up` on
# the VPS therefore cannot alter the crawler's database — which is the whole
# reason the read-only guarantee does not depend on anybody remembering to be
# careful.
#
# For a local database with synthetic data use docker-compose.dev.yml instead.

services:
  product-catalog:
    # TAG is REQUIRED, with no `latest` fallback. A default here means a deploy
    # that forgot to set TAG ships whatever commit the registry considers newest
    # — which is how a rollback stops being a rollback. The same rule as
    # gazon1/dacha-na-udachu-website; the deploy workflow always sets it from
    # the commit being shipped.
    image: ghcr.io/${IMAGE_OWNER:-gazon1}/product-catalog:${TAG:?TAG must be set to the commit SHA tag, e.g. TAG=$(git rev-parse --short HEAD)}
    container_name: product-catalog
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overridable from .env, but defaulted here so `docker compose config`
      # shows a complete picture of what the container needs.
      NODE_ENV: production
      PORT: "3000"
    # Reached through the Caddy container that gazon1/Caddy-vps manages, over
    # the shared external network. NOT a published port: nothing outside this
    # machine should reach the storefront directly, and publishing
    # 127.0.0.1:3000 would put a second way in that silently bypasses TLS and
    # the security headers the route sets.
    networks:
      - default
      - caddy_net
    expose:
      - "3000"
    # The crawler writes on a schedule; a site container restarting in a tight
    # loop while the database is down would only add noise on that machine.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned by the Caddy-vps Ansible role. Declaring it external here
  # means this compose file never creates or deletes it.
  caddy_net:
    external: true
    name: caddy_net