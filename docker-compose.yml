# Production / VPS compose.
#
# The site is a client of the crawler's API and nothing else. There is no `db`
# service here, no volume, no migration step and no parser service: the crawler
# and its database are operated by the crawler repository, and `docker compose
# up` on the VPS cannot touch either of them.
#
# The catalog API is reached over the private NetBird network: the crawler
# publishes no host port, so the address is the crawler's NetBird address and
# the container has to be able to route to it. The deploy workflow checks that
# from inside the container, not only from the host.

services:
  product-catalog:
    # TAG is REQUIRED, with no `latest` fallback. A default here means a deploy
    # that forgot to set TAG ships whatever commit the registry considers newest
    # — which is how a rollback stops being a rollback. The same rule as
    # gazon1/dacha-na-udachu-website; the deploy workflow always sets it from
    # the commit being shipped.
    image: ghcr.io/${IMAGE_OWNER:-gazon1}/product-catalog:${TAG:?TAG must be set to the commit SHA tag, e.g. TAG=$(git rev-parse --short HEAD)}
    container_name: product-catalog
    restart: unless-stopped
    # Named explicitly, one variable at a time, instead of `env_file: .env`.
    # The container gets the catalog's address and the key that opens it — and
    # nothing else that happens to lie in the server's .env. A file that hands
    # the container everything it contains is a file that can hand it a database
    # credential, and the storefront has no business holding one.
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The crawler's address and key. Both are read from the .env file next to
      # this compose file, which the deploy workflow writes; the key never
      # lives in the repository.
      CRAWLER_API_URL: ${CRAWLER_API_URL:?CRAWLER_API_URL must be set — the crawler's NetBird address}
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:?CRAWLER_API_KEY must be set — the crawler's CATALOG_API_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    # Reached through the Caddy container that gazon1/Caddy-vps manages, over
    # the shared external network. NOT a published port: nothing outside this
    # machine should reach the storefront directly, and publishing
    # 127.0.0.1:3000 would put a second way in that silently bypasses TLS and
    # the security headers the route sets.
    networks:
      - default
      - caddy_net
    expose:
      - "3000"
    # The crawler writes on a schedule; a site container restarting in a tight
    # loop while the catalog API is down would only add noise on that machine.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned by the Caddy-vps Ansible role. Declaring it external here
  # means this compose file never creates or deletes it.
  caddy_net:
    external: true
    name: caddy_net
