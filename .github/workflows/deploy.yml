name: Deploy to VPS

# Manual production deploy. Pushing to `main` builds and publishes an image to
# GHCR (see ci.yml); getting that image onto the server is always a deliberate
# action.
#
# Only the storefront is deployed here. The crawler and its database are
# operated in the crawler repository, and the storefront reaches the crawler
# over the private NetBird network — so this workflow neither starts the
# crawler nor checks which crawler is running.
#
# There is no migration step either, and that is the point: the site has no
# database connection at all, so a deploy cannot alter the crawler's database.
# Nothing in this workflow needs to be reversible.
#
# Required repository secrets:
#   VPS_HOST, VPS_USER, VPS_PORT, VPS_APP_DIR, VPS_SSH_KEY, CRAWLER_API_KEY
# Required repository variables:
#   CRAWLER_API_URL (the crawler's address in the NetBird network), PUBLIC_URL
on:
  workflow_dispatch:
    inputs:
      skip_route_check:
        description: "Deploy even if the Caddy route differs from the one on the server"
        type: boolean
        default: false

# Two manual runs must never interleave.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/product-catalog

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Settings → Environments → production restricts who may run this.
    environment: production

    steps:
      # Only needed for the route check — the deploy itself runs on the server.
      - uses: actions/checkout@v7

      # workflow_dispatch lets you pick any ref. Only main is deployable —
      # otherwise you could ship an arbitrary branch to production.
      - name: Refuse to deploy a non-default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy only from main. Refusing to deploy ${{ github.ref_name }}."
          exit 1

      - name: Resolve image tag
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          # docker/metadata-action in ci.yml publishes `format=short`, a
          # 7-character prefix. Match that exactly.
          echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE:${SHA:0:7} (commit $SHA)"

      # Fails here with a clear message rather than midway through a deploy.
      - name: Verify image exists in GHCR
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::Image $IMAGE:$TAG not found in GHCR. Run the CI build for this commit first."
            exit 1
          fi
          echo "Found $IMAGE:$TAG"

      # ubuntu-latest is a fresh VM every run, so ~/.ssh/known_hosts starts
      # empty. Without this the first `ssh` below dies with "Host key
      # verification failed" and never reaches the deploy. Pinning the key here
      # (rather than disabling the check) is what keeps a MITM from silently
      # intercepting the deploy.
      - name: Trust the VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ssh-agent (not a bare openssh-client install) keeps host-key
      # verification on, so a MITM cannot silently intercept the deploy.
      # v0.10.0 takes only `ssh-private-key` — host/username/key/port were
      # removed as inputs, and passing them fails with "ssh-private-key
      # argument is empty". The port travels with each `ssh -p` instead.
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # The route snippet in this repo and the one Caddy actually serves can
      # drift: the snippet is applied by Ansible from a developer machine, the
      # image is deployed from here. Shipping a version whose route was never
      # applied is how you get a 502 that "the deploy succeeded".
      - name: Check the Caddy route matches this commit
        if: ${{ !inputs.skip_route_check }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # NOT the hashFiles() context function: it is documented as a
          # SHA-256 of the matched file, but for a byte-identical file it
          # returned a different digest than sha256sum, so the comparison never
          # matched and every deploy failed this check while the two sides were
          # actually in sync. Both sides are hashed here with the same command.
          local_sum=$(sha256sum deploy/caddy.conf.caddy | cut -d' ' -f1)
          remote_sum=$(ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "sha256sum /opt/caddy/conf.d/product-catalog.caddy 2>/dev/null | cut -d' ' -f1" \
            || echo "<missing>")
          echo "repo      $local_sum"
          echo "installed $remote_sum"
          if [ "$remote_sum" != "$local_sum" ]; then
            echo "::error::The Caddy route differs from deploy/caddy.conf.caddy (or is absent). Apply it first."
            exit 1
          fi
          echo "Route is in sync."

      # The catalog's key reaches the storefront as a file on the server, not as
      # a value in the compose file and not as a line in the repository.
      #
      # The compose file names the variables it passes explicitly, and compose
      # reads the server's .env file to fill them in — and compose interpolates
      # `${...}` inside a .env value, so an unquoted key with a `$` in it would
      # be rewritten on the way in. The values are therefore written
      # single-quoted: compose reads a single-quoted value literally. The key
      # comes from a secret, so it is in neither the repository nor the
      # workflow's log.
      #
      # The address is a repository variable, not a constant: the crawler
      # publishes no host port and is not deployed with the storefront — it is
      # reached over the private NetBird network, and the address is the
      # crawler's address in that network.
      - name: The storefront gets the catalog's address and key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          CRAWLER_API_KEY: ${{ secrets.CRAWLER_API_KEY }}
          CRAWLER_API_URL: ${{ vars.CRAWLER_API_URL }}
          # The site's own public address — the same value the route names and
          # the smoke test asks. The sitemap, robots.txt and the canonical
          # tags are built from it, so a value that is not the address the
          # route serves ships a sitemap full of links that point nowhere.
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "${CRAWLER_API_KEY:-}" ]; then
            echo "::error::The secret CRAWLER_API_KEY is not set."
            echo "::error::Without it the storefront starts with no key for the catalog and answers 503 — honestly, and with nothing to show."
            echo "::error::The value is the crawler's own CATALOG_API_KEY: the same key in two places, and the crawler accepts a list, so a rotation can add the new key first."
            exit 1
          fi
          if [ -z "${CRAWLER_API_URL:-}" ]; then
            echo "::error::The repository variable CRAWLER_API_URL is not set."
            echo "::error::It is the crawler's address in the private NetBird network — the crawler publishes no host port, and the storefront reaches it over the overlay."
            echo "::error::Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::error::The repository variable PUBLIC_URL is not set."
            echo "::error::It is the site's own address: the route serves it, and the sitemap and the canonical tags are built from it."
            echo "::error::Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          # A value that cannot be written into the .env file is refused here,
          # loudly, instead of being written and misread later: a single quote
          # would end the quoted value, a newline would end the line.
          for value in "$CRAWLER_API_URL" "$CRAWLER_API_KEY" "$PUBLIC_URL"; do
            case "$value" in
              *"'"*)
                echo "::error::The catalog address, the catalog key or the public URL contains a single quote, which cannot be written into the server's .env file."
                exit 1
                ;;
              *$'\n'*)
                echo "::error::The catalog address, the catalog key or the public URL contains a newline, which cannot be written into the server's .env file."
                exit 1
                ;;
            esac
          done

          # The three values travel base64-encoded. The encoded text is
          # [A-Za-z0-9+/=] only, so nothing in it can be read as shell syntax
          # when the remote script is parsed, and it is decoded only there — a
          # key that contains `$(...)` or a backtick stays a value instead of
          # becoming a command on the server.
          b64_url=$(printf '%s' "$CRAWLER_API_URL" | base64 -w0)
          b64_key=$(printf '%s' "$CRAWLER_API_KEY" | base64 -w0)
          b64_public=$(printf '%s' "$PUBLIC_URL" | base64 -w0)
          # The deploy directory travels the same way. It is a path, not a
          # secret, but it comes from a secret, and a `$(...)` inside it would
          # be a command on the server just the same.
          b64_dir=$(printf '%s' "$APP_DIR" | base64 -w0)

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          cd "\$(printf '%s' '$b64_dir' | base64 -d)"

          # Decoded here, on the server: the encoded text is inert, the value
          # is not. A decode that fails stops the deploy — it does not write
          # an empty key and sail on.
          api_url="\$(printf '%s' '$b64_url' | base64 -d)"
          api_key="\$(printf '%s' '$b64_key' | base64 -d)"
          site_url="\$(printf '%s' '$b64_public' | base64 -d)"

          # The file keeps everything else it had: the public URL and anything
          # else the server needs stay as they were. The database credentials
          # are the exception: the storefront does not connect to a database
          # any more, so a credential of the crawler's database has no reason
          # to stay on its disk. That covers every spelling of one —
          # DATABASE_*, POSTGRES_* and libpq's own PG* — with or without the
          # `export` prefix compose accepts in a .env file.
          umask 077
          if [ -f .env ]; then
            grep -vE '^(export[[:space:]]+)?(CRAWLER_API_URL|CRAWLER_API_KEY|NEXT_PUBLIC_SITE_URL|DATABASE_URL|DATABASE_[A-Z_]*|POSTGRES_[A-Z_]*|PG[A-Z_]*)=' .env > .env.new || true
          else
            : > .env.new
          fi
          {
            echo ""
            echo "# The catalog's address and key, written by the deploy workflow."
            echo "# The key never lives in the repository, and this file is not in git."
            # Single quotes: compose reads a single-quoted value literally, so a
            # '$' in the key is not rewritten on the way into the container.
            printf "CRAWLER_API_URL='%s'\n" "\$api_url"
            printf "CRAWLER_API_KEY='%s'\n" "\$api_key"
            echo ""
            echo "# The site's own address, written here so that the sitemap, the"
            echo "# robots.txt and the canonical tags name the address that is"
            echo "# actually served. One variable, one address."
            printf "NEXT_PUBLIC_SITE_URL='%s'\n" "\$site_url"
          } >> .env.new
          mv .env.new .env
          chmod 600 .env
          echo "the catalog's address and key are in place"
          EOF

      - name: Deploy to server
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Encoded for the same reason as the key above: the remote script is
          # parsed as shell, so nothing is expanded into it that could be read
          # as shell.
          b64_tag=$(printf '%s' "$TAG" | base64 -w0)
          b64_dir=$(printf '%s' "$APP_DIR" | base64 -w0)

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          app_dir="\$(printf '%s' '$b64_dir' | base64 -d)"
          cd "\$app_dir"
          export TAG="\$(printf '%s' '$b64_tag' | base64 -d)"

          # The compose file lives in this directory, so it must match the
          # commit being deployed. `pull --ff-only` refuses to merge or rebase,
          # so a dirty checkout stops the deploy instead of silently rewriting
          # local work.
          if [ -d .git ]; then
            echo "→ Updating deploy checkout..."
            git pull --ff-only
            echo "Deploy checkout is now at \$(git rev-parse --short HEAD) on \$(git rev-parse --abbrev-ref HEAD)"
          else
            echo "::warning::\$app_dir is not a git checkout — deploying the files as they are on disk."
          fi

          # Git preserves the exec bit only for files it tracks as executable.
          if [ ! -x ./scripts/wait-healthy.sh ]; then
            chmod +x ./scripts/wait-healthy.sh
          fi

          echo "→ Current state before deploy:"
          docker compose images || true

          # Record the running image first so a rollback is one command.
          docker inspect product-catalog --format '{{index .Config.Image}}' 2>/dev/null \
            > /tmp/product-catalog-prev-image || echo "unknown" > /tmp/product-catalog-prev-image
          echo "Previous image: \$(cat /tmp/product-catalog-prev-image)"

          # Pull BEFORE recreating anything: an unreachable image stops the
          # deploy here with the old stack still running.
          docker compose pull

          # `up -d` (not `down`) recreates only changed services, avoiding a
          # full outage.
          docker compose up -d --remove-orphans

          ./scripts/wait-healthy.sh product-catalog 300

          echo "→ Final state:"
          docker compose ps
          EOF

      # The catalog API is on the other side of the private NetBird network, and
      # the container's route to it is not the host's route to it. A check from
      # the host proves nothing about the container: the container that cannot
      # reach the crawler serves error pages while the host curls it fine.
      #
      # So the probe runs inside the container, with the container's own
      # environment — the address and the key it was given. The policy (a refusal
      # fails the deploy, an outage only warns) lives in the script, so that
      # `tests/deploy-probe.test.ts` executes it instead of matching this file.
      - name: The storefront reaches the catalog API from inside the container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          # Encoded for the same reason as the catalog key above: the remote
          # script is parsed as shell, and a secret interpolated into it would be
          # a command if it carried a `$(...)`.
          b64_dir=$(printf '%s' "$APP_DIR" | base64 -w0)

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          cd "\$(printf '%s' '$b64_dir' | base64 -d)"

          if [ ! -x ./scripts/probe-catalog-from-container.sh ]; then
            chmod +x ./scripts/probe-catalog-from-container.sh
          fi
          ./scripts/probe-catalog-from-container.sh product-catalog

          # The key is a server-side secret: it must not be in the bundle that
          # the browser downloads. The container is the place where the bundle
          # actually is, so the bundle is checked where it is.
          if docker exec product-catalog sh -c 'grep -rlF "$CRAWLER_API_KEY" /app/.next /app/server.js 2>/dev/null' | grep -q .; then
            echo "::error::The catalog key is in the storefront's build output. It must never reach the browser."
            exit 1
          fi

          # The name of the variable must not be in the browser's chunks either:
          # it is there only when a client component pulled the server module
          # that reads the key. The image build refuses such a bundle too — this
          # check sees the bundle that was actually deployed.
          if docker exec product-catalog sh -c 'grep -rlF "CRAWLER_API_KEY" /app/.next/static/chunks 2>/dev/null' | grep -q .; then
            echo "::error::A client bundle of the storefront reads CRAWLER_API_KEY. The key is a server-side secret."
            exit 1
          fi
          echo "the catalog API is reachable from the container, and the key is not in the bundle"
          EOF

      # Runs from the runner through the public domain, so it also proves Caddy,
      # TLS and the network path are healthy — not just the container.
      #
      # The logic lives in `scripts/smoke-test.sh` so that its policy is executed
      # by tests rather than matched by a regex against this file: liveness
      # (`/api/health`) fails the deploy, readiness (`/api/ready`) is reported as
      # a dependency warning.
      - name: Smoke test
        env:
          SMOKE_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "::error::Repository variable PUBLIC_URL is not set."
            exit 1
          fi
          if [ ! -x ./scripts/smoke-test.sh ]; then
            chmod +x ./scripts/smoke-test.sh
          fi
          ./scripts/smoke-test.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`$IMAGE:${{ steps.meta.outputs.tag }}\`"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"