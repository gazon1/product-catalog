name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant, and its
# cancelled job would otherwise hold a runner for the length of the build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate first. The Docker build below takes minutes; a type error should
  # fail in seconds instead.
  typecheck-and-test:
    runs-on: ubuntu-latest
    # Generous enough for a cold postgres:16-alpine pull plus the suite. The
    # previous 15 was sized when `npm test` opened no sockets at all.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Runs BEFORE the tests, not after. The tests apply dev/db/ as their
      # schema, so letting them run against a stale copy first would mean a
      # green test run proving nothing and only the later gate noticing.
      #
      # The crawler's migrations are the source of truth for the dev schema.
      # When it is absent the check fails loudly rather than skipping — a gate
      # that reports success having verified nothing is the failure mode this
      # whole file exists to avoid. `||` is therefore not an option here; the
      # job is expected to be run from a checkout that has the crawler beside
      # it, which for a fork means the check will fail and say why.
      - name: Dev schema matches the crawler migrations
        run: bash scripts/check-dev-schema-sync.sh "$CRAWLER_REPO"
        env:
          CRAWLER_REPO: ${{ vars.CRAWLER_REPO || '../wb-parser-kotlin-new' }}

      # `npm test` needs a working Docker daemon: tests/database.test.ts starts a
      # postgres:16-alpine container, applies the crawler migrations above and
      # runs the real listItems / getProduct / listTopDeals against them. This is
      # the check that notices a crawler migration breaking the storefront's
      # queries — nothing else in either repository would.
      #
      # Docker missing is a hard failure, never a skip. `ubuntu-latest` provides
      # it; a self-hosted runner without it must fail and say so rather than
      # report a passing suite while the tests that touch Postgres never ran.
      #
      # Pulling the image here rather than letting testcontainers do it keeps the
      # timeout spent on the pull out of the test run itself.
      - name: Pull the test database image
        run: docker pull postgres:16-alpine

      - name: Unit, architecture and database tests
        run: npm test

      # `npm test` exits 0 whether 138 tests ran or one file was silently
      # excluded by a broken pattern — and the file that needs a container is
      # the first one such a pattern drops. This reads the JUnit XML the run
      # above wrote, so it must come after it, never before.
      #
      # Floors are per file, not per total: a single total lets the other 108
      # tests mask the disappearance of the 30 that talk to Postgres.
      - name: Every recorded test file actually ran
        run: python3 scripts/check-test-runs.py

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-test
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds are pushed as `pr-<n>` so a branch can be reviewed with the
      # real image (`docker pull ghcr.io/<owner>/product-catalog:pr-123`) instead of a
      # local rebuild. Tagged images are pruned weekly by prune-ghcr.yml.
      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/product-catalog
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # `DATABASE_URL` is deliberately absent. The build must not depend on a
      # database existing — that is the bug this project already hit once, where
      # a build-time render baked an empty catalogue into the image. Every route
      # that reads data is `force-dynamic` or on-demand ISR precisely so this
      # build is safe with no database at all.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### Image"
            echo ""
            echo "- \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"