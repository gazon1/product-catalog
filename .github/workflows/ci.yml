name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run on any branch. The pin's pull request is opened by a
  # workflow's token, and the runs it triggers hold in `action_required` until
  # they are approved — the workflow that opens the pull request approves them.
  # This trigger is the way to re-run the checks on a branch by hand.
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant, and its
# cancelled job would otherwise hold a runner for the length of the build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate first. The Docker build below takes minutes; a type error should
  # fail in seconds instead.
  typecheck-and-test:
    runs-on: ubuntu-latest
    # Generous enough for a cold crawler image build — a full Kotlin compile —
    # plus the suite, which starts the image and waits for it to migrate and
    # seed itself.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The crawler is a separate repository, so a plain checkout of this one
      # cannot build its image: the build context is the crawler's own checkout,
      # and it is fetched here as a sibling checkout, which is the layout the
      # build expects. CRAWLER_REPO_URL is a repository variable — the crawler is
      # public, so no token is needed.
      #
      # The checkout is only needed for a pin that names a LOCAL TAG: such an
      # image is built here, from this checkout. A pin that names a DIGEST is
      # pulled from the registry and needs no checkout at all — which is why the
      # step is conditional and why the build below says so when the checkout is
      # missing.
      - name: Check out the crawler as a sibling checkout
        if: ${{ vars.CRAWLER_REPO_URL != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CRAWLER_REPO }}
          ref: ${{ vars.CRAWLER_REF || 'main' }}
          path: ${{ vars.CRAWLER_DIR || 'wb-parser-kotlin-new' }}

      # The pin, read once: the image and the digest it names. The digest is
      # the cache key — the image is what the cache holds, and the digest is
      # what says which image that is.
      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          image="$(grep -vE '^\s*(#|$)' contract/crawler-image.txt | head -1)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"

      # The crawler's image is cached between the runs.
      #
      # GHCR serves anonymous clients at most 100 pulls per hour per address,
      # and the addresses of the runners are shared — so a pull gets refused
      # because of somebody else's run. The cache is keyed by the digest of the
      # pin, so it holds exactly the pinned image and nothing else, and the
      # reference is checked after the load: a cached image that does not
      # answer to the pinned reference is worse than no cache, because the
      # suite verifies that the container it started runs exactly the image
      # the pin names.
      - name: Cache the crawler image
        id: crawler-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crawler-image.tar
          key: crawler-image-${{ steps.pin.outputs.digest }}

      # The contract test runs against a REAL crawler: it starts the crawler's
      # image, lets it create its own schema and seed itself, and validates every
      # answer against the contract document. Nothing else in either repository
      # can catch a crawler that answers with a different shape than the storefront
      # expects — the storefront used to find that out in production, on a page.
      #
      # Two arrangements, one pin. A pin that names a digest is pulled from the
      # registry: the image is exactly the one the digest names, and the suite
      # checks that the container it started runs that image and not some other
      # one. A pin that names a local tag is built from the crawler's checkout
      # beside this one — the arrangement that works before the crawler
      # publishes an image with the API in it. The pin decides which, and
      # nothing else does.
      #
      # Docker missing is a hard failure, never a skip. `ubuntu-latest` provides
      # it; a self-hosted runner without it must fail and say so rather than
      # report a passing suite while the tests that need the crawler never ran.
      - name: Provide the crawler image
        env:
          CRAWLER_DIR: ${{ vars.CRAWLER_DIR || 'wb-parser-kotlin-new' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_READ_USERNAME: ${{ github.actor }}
          IMAGE: ${{ steps.pin.outputs.image }}
          CACHE_FILE: ${{ runner.temp }}/crawler-image.tar
        run: |
          set -euo pipefail
          if [[ "$IMAGE" == *@sha256:* ]]; then
            if [ -f "$CACHE_FILE" ]; then
              echo "restoring the crawler image from the cache"
              docker load --input "$CACHE_FILE"
            fi
            # The reference has to resolve: the suite resolves the pin with
            # `docker image inspect` and compares the id with the image its
            # container actually runs. A restored image that does not answer to
            # the pinned reference is pulled instead.
            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              bash scripts/pull-crawler-image.sh "$IMAGE"
            fi
            if [ "${{ steps.crawler-image-cache.outputs.cache-hit }}" != "true" ]; then
              docker save "$IMAGE" --output "$CACHE_FILE"
            fi
          else
            if [ ! -f "$CRAWLER_DIR/Dockerfile.app" ]; then
              echo "::error::the pin names '$IMAGE', a local tag, which has to be built from the crawler's checkout — and '$CRAWLER_DIR/Dockerfile.app' is not there."
              echo "::error::Either check the crawler out (repository variable CRAWLER_REPO_URL), or pin a digest in contract/crawler-image.txt."
              exit 1
            fi
            docker build --file "$CRAWLER_DIR/Dockerfile.app" --tag "$IMAGE" "$CRAWLER_DIR"
          fi

      - name: Unit, architecture and contract tests
        run: npm test

      # How far the pin is behind the crawler's main.
      #
      # The pin names an image by digest — the image that was checked is the
      # image that gets deployed — but a digest says nothing about when that
      # image was built. A storefront pinned to an image that is three
      # crawler's releases old looks exactly like one that is current.
      #
      # This is a report, not a gate: the storefront adapts to the crawler
      # after the crawler moves, so a lag is the normal state between a
      # crawler's release and the storefront's next one.
      - name: How far the pin is behind the crawler's main
        env:
          CRAWLER_REPO: ${{ vars.CRAWLER_REPO || 'gazon1/wb-parser-kotlin-new' }}
          CRAWLER_REF: ${{ vars.CRAWLER_REF || 'main' }}
        run: |
          set -euo pipefail
          {
            echo "### The pin and the crawler's main"
            echo ""
            # A report that could not be produced is a missing report, not a
            # failed build: it says nothing about the code, and a build that
            # fails because a report is unavailable teaches people to ignore
            # the report.
            bash scripts/pin-lag.sh --repo "$CRAWLER_REPO" --ref "$CRAWLER_REF" \
              || echo "the report could not be produced"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-test
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds are pushed as `pr-<n>` so a branch can be reviewed with the
      # real image (`docker pull ghcr.io/<owner>/product-catalog:pr-123`) instead of a
      # local rebuild. Tagged images are pruned weekly by prune-ghcr.yml.
      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/product-catalog
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # `CRAWLER_API_URL` and `CRAWLER_API_KEY` are deliberately absent. The
      # build must not depend on the catalog being reachable — that is the bug this
      # project already hit once, where a build-time render baked an empty
      # catalogue into the image. Every route that reads data is `force-dynamic`
      # or on-demand ISR precisely so this build is safe with no catalog at all.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### Image"
            echo ""
            echo "- \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"