name: Contract compatibility

# The storefront checked against a crawler image that somebody else built.
#
# ## Why this is a separate workflow
#
# The storefront's own CI checks the crawler image it can build from a sibling
# checkout. That is a good check, and it is not the one that matters: the image
# that matters is the one the crawler published, because that is the one that
# will be deployed. When the crawler publishes an image, it dispatches this
# workflow, which runs the storefront's contract test against that exact image
# and reports its conclusion back to the crawler.
#
# The two repositories are separate, and a contract that only one of them
# checks is a contract nobody checks.
#
# ## What identifies a run
#
# A run is identified by three things together: the crawler's image digest, the
# site's commit SHA, and the id of this workflow's run. The dispatch carries a
# `dispatch_id`, and this workflow prints it and puts it in the name of the
# artifact — so the crawler can match *this* answer to *its* question, rather
# than to "the last green run", which may have been about another image.
#
# The site's SHA is recorded and printed for the same reason: a run against a
# site commit that nobody asked for is not an answer to anything.
#
# ## What fails, and what does not
#
# The contract test starts the crawler image and validates every live answer
# against the contract document the crawler itself serves. A missing image, a
# crawler that will not start, an answer with a different shape — each of them
# fails this workflow. Nothing here skips: a green run that checked nothing is
# the failure mode this repository refuses.

on:
  repository_dispatch:
    types: [crawler-image-published]
  workflow_dispatch:
    inputs:
      crawler_image:
        description: >-
          The crawler image to check against — a digest, or a reference the
          runner can pull. Required: a check against an unnamed image proves
          nothing.
        required: true
        type: string
      site_ref:
        description: The storefront ref to check.
        required: false
        default: main
        type: string
      crawler_tag:
        description: >-
          The tag of the build the image came from. A `pr-<n>` tag is refused:
          a pull request's image is never the deployed one, because the merge
          rebuilds it.
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: contract-compatibility-${{ inputs.site_ref || github.event.client_payload.site_ref || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    # The crawler image has to be built or pulled, the crawler has to migrate
    # and seed itself, and the suite walks the whole catalog.
    timeout-minutes: 45
    env:
      CRAWLER_DIR: ${{ vars.CRAWLER_DIR || 'wb-parser-kotlin-new' }}
      DISPATCH_ID: ${{ github.event.client_payload.dispatch_id || inputs.dispatch_id || 'manual' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_ref || github.event.client_payload.site_ref || github.ref }}

      # The site's commit is part of the run's identity: it is recorded, printed
      # and returned, so that the crawler can check that the answer it received
      # is about the site it asked about.
      - name: Record the site's commit
        run: |
          set -euo pipefail
          # The commit is put into the environment for the later steps and printed
          # here. It is read into a shell variable first: writing to `$GITHUB_ENV`
          # only tells the *later* steps, and this step prints the value it just
          # wrote — under `set -u` a name that the shell has never seen is a
          # fatal error, not an empty string.
          site_sha="$(git rev-parse HEAD)"
          echo "SITE_SHA=$site_sha" >> "$GITHUB_ENV"
          echo "site commit: $site_sha"
          echo "dispatch id:  $DISPATCH_ID"

      # The contract document is the crawler's own, and the storefront keeps no
      # copy of it — two documents describing the same shapes are two sources of
      # truth. It is read from the crawler's checkout, which is why the crawler
      # is checked out beside the storefront.
      # The contract document and the image must come from the same commit.
      #
      # The image is a *build*, and a build belongs to a commit. The dispatch
      # carries that commit; the checkout follows it. Checking out `main`
      # instead would validate the answers of a pull request's image against
      # the contract of a different commit — and the two can differ, which is
      # exactly the case where the check has to be right.
      - name: Check out the crawler as a sibling checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CRAWLER_REPO }}
          ref: ${{ github.event.client_payload.crawler_commit || vars.CRAWLER_REF || 'main' }}
          path: ${{ env.CRAWLER_DIR }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # A registry image has to be pulled before the suite can start it: the
      # suite resolves the image reference to an image id and compares it with
      # the id of the container it actually started, and an image that is not
      # on the machine has no id.
      #
      # The login is optional — a public package needs none — and it is skipped
      # when the token is absent rather than failing, because a package that is
      # public does not need a secret to be pulled.
      #
      # A local tag is built from the crawler's checkout beside this one. The
      # dispatcher names the image it published, which is a registry reference;
      # the tag is the arrangement that works before the crawler publishes one.
      - name: Provide the crawler image
        env:
          IMAGE: ${{ inputs.crawler_image || github.event.client_payload.crawler_image }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          image="${IMAGE:-}"
          if [ -z "$image" ]; then
            echo "::error::no crawler image was named — a check against an unnamed image proves nothing."
            exit 1
          fi
          if [[ "$image" == *@sha256:* ]]; then
            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            fi
            docker pull "$image"
          else
            docker build --file "$CRAWLER_DIR/Dockerfile.app" --tag "$image" "$CRAWLER_DIR"
          fi

      # The suite applies no SQL of its own: it starts the crawler, lets it
      # migrate and seed itself, and talks to it over HTTP.
      - name: Check the storefront against the crawler image
        env:
          CONTRACT_CRAWLER_IMAGE: ${{ inputs.crawler_image || github.event.client_payload.crawler_image }}
        run: npm run contract-check

      # The reports are named after the dispatch, so that the crawler's question
      # and this answer are joined by a name and not by a timestamp.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report-${{ env.DISPATCH_ID }}
          path: build/test-results/**

      # The dispatch id and the site's commit are printed again at the end: the
      # crawler reads them from the run's log when it correlates the answer.
      - name: The identity of this run
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Contract compatibility"
            echo ""
            echo "- Crawler image: \`${{ inputs.crawler_image || github.event.client_payload.crawler_image }}\`"
            echo "- Site commit: \`$SITE_SHA\`"
            echo "- Dispatch id: \`$DISPATCH_ID\`"
            echo "- Run id: \`${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The pin moves on the strength of a green compatibility run, and only then.
  #
  # ## Why this is a separate job
  #
  # It `needs: contract`, so it runs only when the compatibility check passed —
  # and the dependency is the proof, rather than a check of the proof. A run
  # that reports "success" because it was skipped would move the pin to an
  # image nobody checked the storefront against.
  #
  # ## Why it opens a pull request and does not commit
  #
  # The pin is a decision: "this storefront understands this crawler image".
  # A commit would make the decision automatic, and an automatic decision
  # about which crawler a storefront depends on is not a decision anybody made.
  # The pull request carries the digest and links to the run that proved it.
  #
  # The pull request is not the end of the story: it runs no checks of its own
  # (a pull request opened by a workflow's token triggers no workflow), so this
  # job dispatches the storefront's own workflows on the pin's branch and waits
  # for them. The contract test reads the pin, so it runs against the image the
  # pin names — the pin is checked by the thing it claims. Only then does the
  # pull request ask to be merged, and the branch protection has the last word.
  #
  # ## Why it refuses a pull request's image
  #
  # The image of a pull request and the image of the merge that follows it are
  # two different images with two different digests — the merge rebuilds. A pin
  # that named the pull request's digest would name an image that is never
  # deployed. The script refuses a `pr-<n>` tag for exactly that reason.
  #
  # ## The two ways in
  #
  # A dispatch from the crawler carries the image it published and the tag of
  # the build it came from — nothing to say. A manual run carries the image the
  # operator named, and the tag they named with it: the operator takes
  # responsibility for saying that the image is a release build, and the script
  # still refuses a pull request's tag.
  #
  # ## Which token opens the pull request
  #
  # The token of the run may open a pull request only when the repository has
  # allowed Actions to create and approve pull requests (Settings → Actions →
  # General). When it has not, the run's own token is refused — and a run that
  # cannot open the pull request must not pretend it has moved the pin, so the
  # job fails there rather than quietly.
  #
  # A token the owner controls is the alternative: a fine-grained token with
  # Contents: RW and Pull requests: RW on this repository, stored as the
  # `PIN_PR_TOKEN` secret, is used in preference to the run's own. It is
  # optional — the run's own token is the default, and the secret is there for
  # the owner who would rather not flip a repository setting.
  pin:
    runs-on: ubuntu-latest
    # The pin's pull request is checked before it merges, and those checks are
    # two full runs of this repository's own workflows. Ten minutes was enough
    # to open a pull request and nothing else.
    timeout-minutes: 45
    needs: contract
    # A dispatch from the crawler carries the image it published; a manual run
    # carries the image the operator named. Either way the pin needs a digest.
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        startsWith(github.event.client_payload.crawler_image, 'ghcr.io/') &&
        contains(github.event.client_payload.crawler_image, '@sha256:')
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.crawler_image, 'ghcr.io/') &&
        contains(inputs.crawler_image, '@sha256:')
      )
    permissions:
      contents: write
      pull-requests: write
      # Dispatching this repository's own workflows on the pin's branch needs
      # this right; without it the dispatch is refused and the pull request
      # would wait for checks that never ran.
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_ref || github.event.client_payload.site_ref || github.ref }}

      # The runner has no git identity: a fresh checkout has none, and a commit
      # without one is refused outright ("Please tell me who you are"). The
      # commit is made by this workflow, so this workflow says who it is — the
      # bot account GitHub gives every run — and the identity is set on the
      # repository rather than globally, so nothing outside it is touched.
      - name: Tell git who is committing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move the pin, in a pull request
        id: move
        env:
          # The run's own token, unless the owner stored one they control.
          GH_TOKEN: ${{ secrets.PIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          # The branch the pin lives on. The script reads the same name, so the
          # two cannot disagree about which pull request is the pin's.
          PIN_BRANCH: ${{ vars.PIN_BRANCH || 'chore/pin-crawler-image' }}
          CRAWLER_IMAGE: ${{ inputs.crawler_image || github.event.client_payload.crawler_image }}
          CRAWLER_TAG: ${{ inputs.crawler_tag || github.event.client_payload.tag }}
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Exit code 1 from the script is a *refusal*, not a failure: a pull
          # request's image is never the deployed one, and the pin must not name
          # it. That is the script doing its job, so the job ends green — a red
          # job here would say "the storefront is incompatible", and the
          # compatibility check is a different job with a different answer.
          status=0
          bash scripts/update-image-pin.sh \
            --digest "$CRAWLER_IMAGE" \
            --tag "$CRAWLER_TAG" \
            --run-id "$RUN_ID" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::notice::the pin does not move for a pull request's image — that is the rule, not a failure"
            exit 0
          fi
          exit "$status"

      # The pull request is found by the digest it names, not by its branch
      # alone: an earlier pull request may still be open on the same branch,
      # and that one names another image. Merging it would move the pin to an
      # image this run never checked.
      - name: The pull request the pin opened
        id: pin_pr
        env:
          GH_TOKEN: ${{ secrets.PIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          PIN_BRANCH: ${{ vars.PIN_BRANCH || 'chore/pin-crawler-image' }}
          CRAWLER_IMAGE: ${{ inputs.crawler_image || github.event.client_payload.crawler_image }}
        run: |
          set -euo pipefail
          owner="${SITE_REPO%%/*}"
          digest="${CRAWLER_IMAGE##*@}"
          number="$(gh api "repos/${SITE_REPO}/pulls?state=open&head=${owner}:${PIN_BRANCH}" \
            --jq "[.[] | select((.body // \"\") | contains(\"${digest}\"))] | .[0].number // empty")"
          if [ -z "$number" ]; then
            echo "::notice::no open pull request names ${digest} — the pin did not move, so there is nothing to check"
            exit 0
          fi
          echo "the pin's pull request is #${number} on ${PIN_BRANCH}"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "branch=${PIN_BRANCH}" >> "$GITHUB_OUTPUT"

      # The pull request's own checks are waiting for approval.
      #
      # A pull request opened by a workflow's token does trigger this
      # repository's workflows — but the runs it triggers hold in
      # `action_required` until somebody approves them, and nobody is watching:
      # the pull request is opened by a job, and the job is the one that has to
      # let it run. The approval is this job's to give, with the same token
      # that opened the pull request.
      #
      # Approving is not a workaround: these are the ordinary checks of the
      # ordinary pull request. The contract test reads `contract/crawler-image.txt`,
      # so it runs against the image the pin names — the pin is checked by the
      # thing it claims.
      - name: The pull request's checks are approved
        id: pin_approve
        if: steps.pin_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          PIN_BRANCH: ${{ steps.pin_pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pin_pr.outputs.number }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${SITE_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "the pull request's head is ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          # The runs appear a moment after the pull request does. A run that
          # has not appeared yet is a run that does not exist, and a run that
          # never appears is a pull request whose checks never ran.
          deadline=$(( $(date +%s) + 300 ))
          pending=""
          while [ -z "$pending" ]; do
            pending="$(gh api "repos/${SITE_REPO}/actions/runs?event=pull_request&branch=${PIN_BRANCH}&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${sha}\" and .conclusion == \"action_required\")] | map(.id) | join(\" \")")"
            if [ -z "$pending" ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::no run of the pull request's head is waiting for approval — the pin's checks never started"
                exit 1
              fi
              echo "waiting for the pull request's runs to appear..."
              sleep 10
            fi
          done

          for run in $pending; do
            gh api --method POST "repos/${SITE_REPO}/actions/runs/${run}/approve" >/dev/null
            echo "approved the run ${run}"
          done

      # And waited for. The runs that were approved are the pull request's own
      # checks, and the branch protection asks about them by name.
      - name: The pin's branch is checked
        id: pin_checks
        if: steps.pin_pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          PIN_BRANCH: ${{ steps.pin_pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pin_pr.outputs.number }}
          SHA: ${{ steps.pin_approve.outputs.sha }}
        run: |
          set -euo pipefail
          green=true
          deadline=$(( $(date +%s) + 1800 ))

          for workflow in ci.yml contract-types.yml; do
            run_id=""
            while [ -z "$run_id" ]; do
              run_id="$(gh api "repos/${SITE_REPO}/actions/workflows/${workflow}/runs?head_sha=${SHA}&per_page=20" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${SHA}\")] | sort_by(.created_at) | .[-1].id // empty")"
              if [ -z "$run_id" ]; then
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::the ${workflow} run of the pull request's head never appeared — the pin is unchecked"
                  green=false
                  break
                fi
                echo "waiting for the ${workflow} run to appear..."
                sleep 15
              fi
            done
            [ -n "$run_id" ] || continue

            # The run is waited for, not assumed: a run that never finishes is
            # not a green check, it is no check at all.
            while [ "$(gh api "repos/${SITE_REPO}/actions/runs/${run_id}" --jq '.status')" != "completed" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::the ${workflow} run ${run_id} did not finish — the pin is unchecked"
                green=false
                break 2
              fi
              sleep 20
            done

            # The jobs are read by name: a run can conclude green while a job
            # it needed was skipped, and the branch protection asks about the
            # jobs, not about the run.
            echo "the ${workflow} run ${run_id}:"
            gh api "repos/${SITE_REPO}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | "  \(.name): \(.conclusion // .status)"'
            conclusion="$(gh api "repos/${SITE_REPO}/actions/runs/${run_id}" --jq '.conclusion')"
            if [ "$conclusion" != "success" ]; then
              echo "::error::the ${workflow} run ${run_id} concluded '${conclusion}' — the pin does not move"
              green=false
            fi
          done

          echo "green=${green}" >> "$GITHUB_OUTPUT"

      # The pin merges itself once its own checks are green. The pull request
      # is the decision, and the decision is taken by the checks it carries:
      # the same gates every other pull request in this repository passes.
      - name: The pin merges itself
        if: steps.pin_pr.outputs.number != '' && steps.pin_checks.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.PIN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pin_pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$SITE_REPO" --auto --squash
          echo "the pin's pull request #${PR_NUMBER} is queued to merge once the branch protection is satisfied"

      - name: The identity of the pin
        if: always()
        run: |
          {
            echo "### Image pin"
            echo ""
            echo "- Crawler image: \`${{ inputs.crawler_image || github.event.client_payload.crawler_image }}\`"
            echo "- Compatibility run: \`${{ github.run_id }}\`"
            echo "- Dispatch id: \`${{ github.event.client_payload.dispatch_id }}\`"
            echo "- Pull request: \`${{ steps.pin_pr.outputs.number || 'none' }}\`"
            echo "- Checks on the pin's branch: \`${{ steps.pin_checks.outputs.green || 'not run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

