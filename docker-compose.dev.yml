# Local development: the storefront alone.
#
# The crawler is not here any more. It is a separate, independently operated
# service (wb-parser-kotlin-new): it owns its image, its PostgreSQL and its
# schema, and this repository only reads its HTTP API. There is no `db` service
# here and no `wb-parser` service here — nothing in this file starts, stops or
# configures the crawler.
#
#   just dev     # next dev on :3000 against a crawler that is already running
#
# The crawler is reached over the network, so its address comes from the
# environment: CRAWLER_API_URL names it, CRAWLER_API_KEY opens it. Compose reads
# both from the `.env` file in this directory (or from the shell), which is
# where the same two values live for production.

services:
  web:
    build:
      context: .
    container_name: product-catalog-dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      # The crawler's catalog API. The storefront never sees a database
      # connection string, and it cannot write — it holds a key and reads.
      CRAWLER_API_URL: ${CRAWLER_API_URL:-http://host.docker.internal:8080}
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:-}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    # The crawler usually runs on the developer's own machine, outside Docker.
    # `host.docker.internal` is how a container names the host it runs on.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      # Source is mounted for hot reload; node_modules stays container-local
      # because a Linux-built native module and the host's can disagree.
      - .:/app
      - /app/node_modules
